
name: Nexas Safe Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - NexasSafe-Android-Source.zip
      - .github/workflows/android.yml

permissions:
  contents: read

concurrency:
  group: nexas-safe-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Nexas Safe APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f NexasSafe-Android-Source.zip
          mkdir -p project
          unzip -q NexasSafe-Android-Source.zip -d project
          WRAPPER=$(find project -name gradlew -type f -print -quit)
          test -n "$WRAPPER"
          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: NexasSafe-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
